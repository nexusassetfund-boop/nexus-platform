name: 수출입 데이터 스크리너
on:
  schedule:
    # 새 데이터가 나오는 날에만 돈다 — 매일 돌 이유가 없다.
    #  잠정치: 1~10일치는 11일, 1~20일치는 21일, 전월 전체는 익월 1일 공개
    #  확정치: 매월 15일경 전월분 현행화
    # 09:00 UTC = 18:00 KST 로 같은 날짜다(22시 UTC를 쓰면 KST 날짜가 하루 밀려
    # "말일" 표현이 필요해진다). 발표는 오전이므로 18시면 충분히 여유가 있다.
    - cron: "0 9 1,11,15,21 * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: trade-stats, cancel-in-progress: false }
jobs:
  trade-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30    # 월 단위 데이터 — 대부분 캐시 히트로 끝난다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: 의존성 설치
        run: pip install -r requirements.txt
      # 관세청 응답 캐시를 러너 간에 보존한다. 러너는 매번 새로 뜨므로 캐시가 없으면
      # 36개월 × 조합 수만큼 매일 다시 호출해 개발계정 한도(10,000회/월)를 금방 넘긴다.
      # 월 단위 데이터라 지난 달들은 값이 바뀌지 않아 캐시가 그대로 유효하다.
      - name: 관세청 응답 캐시 복원
        uses: actions/cache@v4
        with:
          path: docs/data/trade_raw_cache.json
          key: trade-cache-${{ github.run_id }}
          restore-keys: trade-cache-
      - name: 수출입 스크리닝
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          python scanner/trade_stats.py
          python scanner/trade_discover.py || echo "발굴 실패 — 스캔 산출물은 유지"
      - name: 발굴 품목 주석 준비 (전부 캐시돼 있으면 skip)
        run: python -X utf8 scanner/trade_discover_annotate.py prepare || echo "주석 준비 실패 — 계속"
      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code
      - name: 발굴 품목 주석 (Claude — 품목 설명·후보 상장사, 수치 창작 금지)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat scanner/trade_discover_prompt.md)" \
            --allowedTools "Read,Write" \
            --permission-mode acceptEdits \
            --max-turns 20 || echo "주석 생성 실패 — 기존 주석 유지"
      - name: 주석 병합
        run: python -X utf8 scanner/trade_discover_annotate.py publish || echo "병합 실패 — 계속"
      - name: 결과 커밋
        run: |
          test -f docs/data/trade.json || { echo "출력 없음 — 커밋 생략"; exit 0; }
          # 주석 캐시도 함께 커밋한다 — 빠지면 매 실행이 전 품목을 다시 LLM 주석한다.
          bash .github/scripts/commit-data.sh "trade: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" \
            docs/data scanner/data/discover_annotations.json
      - name: KV 즉시 반영 (다음 스캔 동기화 대기 없이)
        env: { NEXUS_ADMIN_TOKEN: "${{ secrets.NEXUS_ADMIN_TOKEN }}" }
        run: |
          test -f docs/data/trade.json || exit 0
          python - > /tmp/push.json <<'PY'
          import json, os
          files = {'trade.json': json.load(open('docs/data/trade.json'))}
          # 리포트도 있으면 함께 민다 — trade-report 실행의 KV push가 실패했을 때의 복구 경로.
          if os.path.exists('docs/data/trade_report.json'):
              files['trade_report.json'] = json.load(open('docs/data/trade_report.json'))
          if os.path.exists('docs/data/trade_discover.json'):
              files['trade_discover.json'] = json.load(open('docs/data/trade_discover.json'))
          print(json.dumps({'files': files}))
          PY
          curl -sf -X POST "https://nexus-platform.nexusassetfund.workers.dev/api/push" \
            -H "Authorization: Bearer $NEXUS_ADMIN_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/push.json || echo "KV push 실패 — 다음 스캔 동기화 때 자동 반영됨"
