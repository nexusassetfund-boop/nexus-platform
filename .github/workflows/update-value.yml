name: 가치투자 재무 갱신
on:
  push:
    paths: [ "value_universe.json" ]   # 종목 편집 커밋 시 자동
  workflow_dispatch: {}                 # 분기보고서 나왔을 때 수동
permissions:
  contents: write
concurrency: { group: value, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 재무 스캔
        env: { DART_API_KEY: "${{ secrets.DART_API_KEY }}" }
        run: python scanner/fetch_value.py
      - name: 결과 커밋
        run: |
          bash .github/scripts/commit-data.sh "value: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" docs/data/value.json
      - name: KV 즉시 반영 (value 단독 커밋은 스캔 동기화를 타지 않으므로 직접 push)
        env: { NEXUS_ADMIN_TOKEN: "${{ secrets.NEXUS_ADMIN_TOKEN }}" }
        run: |
          python scanner/kv_push.py docs/data/value.json --optional --ignore-push-error
