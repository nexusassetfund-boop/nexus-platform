name: 수출입 매핑 검증
# 스케줄 없음 — stock_trade_map.json(사람이 큐레이션)을 고친 뒤 수동 실행한다.
# 시도 내 점유율·순위를 뽑아 검증하고, 통과분만 trade_map.json으로 저장한다.
# DART를 쓰지 않는다 — 본점 주소는 등기상 본사라 공장 위치와 다르다(기아=서초구).
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "특정 종목만 검증 (공백 구분 6자리 코드, 비우면 전체)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: trade-map, cancel-in-progress: false }
jobs:
  trade-map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: 의존성 설치
        run: pip install -r requirements.txt
      # 관세청 응답 캐시를 러너 간에 보존한다. 러너는 매번 새로 뜨므로 캐시가 없으면
      # 매번 전량 재호출해 개발계정 한도(10,000회/월)를 금방 넘긴다.
      - name: 관세청 응답 캐시 복원
        uses: actions/cache@v4
        with:
          path: docs/data/trade_raw_cache.json
          key: trade-cache-${{ github.run_id }}
          restore-keys: trade-cache-
      - name: 매핑 검증
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python -X utf8 scanner/verify_trade_map.py ${{ inputs.tickers }}
      - name: 결과 커밋
        run: |
          test -f scanner/data/trade_map.json || { echo "출력 없음 — 커밋 생략"; exit 0; }
          bash .github/scripts/commit-data.sh "trade-map: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" scanner/data
