name: 수급 감지기 일간 스캔
on:
  schedule:
    - cron: "50 7 * * 1-5"    # 매일 평일 16:50 KST (CANSLIM 이후 — 네이버 부하 분산)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: flow, cancel-in-progress: false }
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20    # 유니버스 300종목 × 네이버 2페이지 (8스레드)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 수급 스크리닝
        env:
          # KRX 투자자 상세(금융투자·연기금 분리)용 — data.krx.co.kr 무료 계정.
          # 없으면 상세 없이 기관합계로 자동 폴백된다.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scanner/flow_screener.py
      - name: 결과 커밋
        run: |
          test -f docs/data/flow.json || { echo "출력 없음 — 커밋 생략"; exit 0; }
          bash .github/scripts/commit-data.sh "flow: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" docs/data
      - name: KV 즉시 반영 (다음 스캔 동기화 대기 없이)
        env: { NEXUS_ADMIN_TOKEN: "${{ secrets.NEXUS_ADMIN_TOKEN }}" }
        run: |
          test -f docs/data/flow.json || exit 0
          python - > /tmp/push.json <<'PY'
          import json
          print(json.dumps({'files': {'flow.json': json.load(open('docs/data/flow.json'))}}))
          PY
          curl -sf -X POST "https://nexus-platform.nexusassetfund.workers.dev/api/push" \
            -H "Authorization: Bearer $NEXUS_ADMIN_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/push.json || echo "KV push 실패 — 다음 스캔 동기화 때 자동 반영됨"
